<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NIET DevOps Project</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --primary: #38bdf8;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 2.5rem;
      max-width: 560px;
      width: 100%;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    h1 {
      font-size: 1.8rem;
      color: var(--primary);
      margin-bottom: 0.75rem;
    }
    p {
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }
    .badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      background: rgba(56, 189, 248, 0.15);
      color: var(--primary);
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }
    ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    li {
      background: rgba(255, 255, 255, 0.03);
      padding: 0.6rem 0.9rem;
      border-radius: 6px;
      border-left: 3px solid var(--primary);
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">Git & DevOps Demo</span>
    <h1>Welcome to NIET DevOps</h1>
    <p>This is a sample index file created to practice Git staging, commits, branches, and version control workflows.</p>
    <ul>
      <li>&#x2714; HTML structure initialized</li>
      <li>&#x2714; Modern responsive styling added</li>
      <li>&#x2714; Ready for Git staging and commit</li>
    </ul>
  </div>
</body>
</html>
